<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phil Tran</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0b;
            --surface: #111113;
            --border: #1e1e22;
            --text: #e4e4e7;
            --text-dim: #71717a;
            --accent: #22d3ee;
            --accent-dim: rgba(34, 211, 238, 0.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Subtle animated grid background */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 20%, transparent 70%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 640px;
            width: 100%;
            padding: 2rem;
        }

        /* Latency pulse indicator */
        .pulse-line {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.4); }
            50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(34, 211, 238, 0); }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        h1 .accent {
            color: var(--accent);
        }

        .tagline {
            font-size: 1.15rem;
            font-weight: 300;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .tagline strong {
            color: var(--text);
            font-weight: 500;
        }

        /* Stats row */
        .stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 2.5rem;
            padding: 1.25rem 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Skill tags */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
        }

        .skill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            padding: 0.4rem 0.85rem;
            border-radius: 6px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid rgba(34, 211, 238, 0.12);
            transition: background 0.2s, border-color 0.2s;
        }

        .skill:hover {
            background: rgba(34, 211, 238, 0.14);
            border-color: rgba(34, 211, 238, 0.25);
        }

        /* Links */
        .links {
            display: flex;
            gap: 1rem;
        }

        .link {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1.4rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }

        .link:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            transform: translateY(-1px);
        }

        .link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Responsive */
        @media (max-width: 640px) {
            h1 { font-size: 2.5rem; }
            .stats { flex-direction: column; gap: 1rem; }
            .container { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="container">
        <div class="pulse-line">
            <span class="pulse-dot"></span>
            <span>AVAILABLE FOR OPPORTUNITIES</span>
        </div>

        <h1>Phil<span class="accent">.</span></h1>

        <p class="tagline">
            <strong>Low-Latency Java Engineer</strong> building
            performance-critical systems where every microsecond counts.
        </p>

        <div class="stats">
            <div class="stat">
                <span class="stat-value">Java</span>
                <span class="stat-label">Primary Language</span>
            </div>
            <div class="stat">
                <span class="stat-value">HFT</span>
                <span class="stat-label">Domain</span>
            </div>
            <div class="stat">
                <span class="stat-value">&micro;s</span>
                <span class="stat-label">Latency Target</span>
            </div>
        </div>

        <div class="skills">
            <span class="skill">Low-Latency</span>
            <span class="skill">JVM Tuning</span>
            <span class="skill">Lock-Free</span>
            <span class="skill">Market Data</span>
            <span class="skill">Order Routing</span>
            <span class="skill">FIX Protocol</span>
            <span class="skill">TCP/UDP</span>
            <span class="skill">Mechanical Sympathy</span>
        </div>

        <div class="links">

        </div>
    </div>
</body>
</html>
